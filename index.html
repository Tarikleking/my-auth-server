
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KingDZ VIP Key Panel</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<div class="container">

<h1>لوحة إدارة المفاتيح</h1>

<div class="card">

<label>مدة المفتاح</label>

<select id="duration">
<option value="1 دقيقة">1 دقيقة</option>
<option value="1 ساعة">1 ساعة</option>
<option value="1 يوم">1 يوم</option>
<option value="1 أسبوع">1 أسبوع</option>
<option value="1 شهر">1 شهر</option>
<option value="1 سنة">1 سنة</option>
</select>

<label>عدد المفاتيح</label>

<input
type="number"
id="count"
value="1"
min="1"
max="100">

<button id="generate">
توليد المفاتيح
</button>

<button id="copyAll">
نسخ جميع المفاتيح
</button>

</div>

<div class="card">

<h2>المفاتيح</h2>

<table>

<thead>

<tr>

<th>المفتاح</th>

<th>المدة</th>

<th>الحالة</th>

</tr>

</thead>

<tbody id="keysTable">

</tbody>

</table>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
